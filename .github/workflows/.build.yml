name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          test -f shadowims.zip || { echo "shadowims.zip is missing from the repository root"; exit 1; }
          mkdir -p project
          unzip -q shadowims.zip -d project
          echo "Extracted archive contents:"
          find project -maxdepth 3 -type f | sort | head -200

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -euo pipefail
          ROOT="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            ROOT="$(find project -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit | xargs -r dirname | sed 's#/app$##')"
          fi
          if [ -z "$ROOT" ]; then
            echo "Could not find Gradle settings file or an app Gradle build file inside shadowims.zip"
            exit 1
          fi
          echo "Building project at: $ROOT"
          gradle -p "$ROOT" assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr-shadow-device-info-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
